<!doctype html><meta charset="utf-8"><title>verificación del PDF</title>
<script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"></script>
<body><div id="r">listo</div>
<script>
// Lee los QR directamente del PDF rasterizado: no del SVG, no del archivo
// suelto, sino del artefacto que va a imprenta.
window.verificar = async function (png) {
  const meta = await (await fetch('/qrs.json?v=' + Date.now())).json();
  const img = new Image();
  img.src = '/' + (png || 'qrs.png') + '?v=' + Date.now();
  await new Promise((ok, err) => { img.onload = ok; img.onerror = err; });
  const E = meta.esc * meta.mm;                 // píxeles por milímetro
  const out = [];
  for (const q of meta.qrs) {
    const lado = Math.round(q.l * E), m = Math.round(2 * E);   // 2 mm de margen
    const c = document.createElement('canvas');
    c.width = c.height = lado + 2 * m;
    const cx = c.getContext('2d', { willReadFrequently: true });
    cx.fillStyle = '#fff'; cx.fillRect(0, 0, c.width, c.height);
    cx.drawImage(img, Math.round((q.x - meta.x0) * E) - m,
                      Math.round((q.y - meta.y0) * E) - m,
                      c.width, c.height, 0, 0, c.width, c.height);
    const d = cx.getImageData(0, 0, c.width, c.height);
    const leido = jsQR(d.data, c.width, c.height);
    out.push({ id: q.id, url: leido ? leido.data : null, px: lado });
  }
  return out;
};
</script></body>

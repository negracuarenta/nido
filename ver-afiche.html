<!doctype html><meta charset="utf-8"><title>mapa</title>
<style>body{margin:0;background:#666;font:12px sans-serif}
#todo{width:100vw;display:block;border-bottom:3px solid #333}
.caja{position:relative;overflow:hidden;border-bottom:3px solid #333}
.caja img{position:absolute}
b{position:absolute;z-index:9;background:#000;color:#fff;padding:2px 6px}</style>
<script>
const v=Date.now();
const q=new URLSearchParams(location.search);
const f=q.get('f')||'MAPA_FINAL_es_color.svg';
document.write(`<img id="todo" src="/${f}?v=${v}">`);
// Recortes a escala, en milímetros del pliego: [x, y, ancho, alto, zoom, rótulo]
const vistas = JSON.parse(q.get('z')||'[[45,316,300,90,2.6,"cartela"]]');
for (const [x,y,w,h,k,nom] of vistas)
  document.write(`<div class="caja" style="width:${w*k}px;height:${h*k}px">
<b>${nom} ×${k}</b><img src="/${f}?v=${v}"
style="width:${1189*k}px;left:${-x*k}px;top:${-y*k}px"></div>`);
</script>
